<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Catalog</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="header">
    <h1>Product Catalog</h1>
    <p>Explore our latest products and find your favorites.</p>
</header>

<main class="container">

    <section class="featured-section">
        <h2>Featured Product</h2>
        <div id="featuredProduct"></div>
    </section>

    <section class="controls">

        <div class="control-group">
            <label for="searchInput">Search Product</label>
            <input
                type="text"
                id="searchInput"
                placeholder="Search by product name..."
            >
        </div>

        <div class="control-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>
        </div>

        <div class="control-group">
            <label for="sortFilter">Sort by Price</label>
            <select id="sortFilter">
                <option value="default">Default Order</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <button id="resetBtn" type="button">Reset Filters</button>

    </section>

    <section class="catalog-info">
        <h2>All Products</h2>
        <p id="productCount">Loading products...</p>
        <p id="totalPrice">Total Price: ₹0</p>
    </section>

    <section id="productContainer" class="product-grid"></section>

    <p id="emptyMessage" hidden>
        No products found. Try another search or category.
    </p>

</main>

<footer>
    <p>© 2026 Product Catalog | Day 20 JavaScript Project</p>
</footer>

<script type="module" src="./script.js"></script>

</body>
</html>
